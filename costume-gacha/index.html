const COM=`【画像生成ルール】
添付画像の人物を使い、世界の伝統衣装をテーマにした一枚絵を生成してください。衣装文化と各条件は、外部ツールで抽選済みです。

・顔立ち、年齢印象、髪色、髪型、髪の長さ、瞳、肌色、体格、骨格、耳・角・尻尾・翼などの身体的特徴を維持する。衣装に伴う自然なヘアアレンジは許可する。
・参照画像の衣装、配色、露出度、装身具、ポーズ、表情、背景、構図は引き継がない。人物の身体的特徴と、元衣装のデザイン情報を分離する。
・過去に生成した画像の衣装、配色、背景、小物、ポーズ、表情、構図の傾向を引き継がない。参照人物以外の別キャラクターの特徴を混入させない。

■抽選結果の固定
・下の確定抽選シートに従う。人物との相性、衣装の知名度、生成しやすさ、見栄えを理由に、衣装文化や構図条件を変更しない。
・条件が組み合わせにくい場合も、まず自然に共存できる場面と身体配置を考える。物理的・解剖学的に成立しない場合のみ、その項目の意図を最大限保って調整する。
・顔方向、視線、身体の向き、カメラ位置、高さ、画角は、独立した条件として扱う。「この人物に最も似合う構図」へ固定しない。

■衣装
・抽選された衣装文化に実在する、具体的な衣装形式を出発点にする。シルエット、構造、着方、素材、模様、装身具、頭飾り、履物など、識別できる主要な特徴を残す。毎回同じ代表衣装に固定しない。
・完全な歴史再現は不要。キャラクターイラストとして成立するよう、形状・比率・装飾量は整理してよい。奇抜な特徴は消さず、その衣装ならではの魅力として活かす。元文化と無関係な要素を大量に足して別物にしない。
・配色は、その文化で実際に見られる伝統的・地域的な配色から決める。人物の髪色・瞳・肌色・元衣装に合わせない。偶然近くなるのは構わない。
・ファンタジー的な肌見せ、不要なスリット、露出のための布の省略をしない。文化的に露出が自然な衣装は、その特徴を維持する。
・人物が人間以外の場合も、その特徴を維持する。獣耳があっても、獣人専用のファンタジー衣装に変えない。

・場面は衣装文化から逆算せず、抽選結果に従って具体的な場所に置き換える。「有名な建築物」「宮殿」「観光写真のような場所」へ自動的に結びつけない。

・首から肩、肩から腕、胸郭から腰、骨盤から脚までを自然につなげる。関節が衣装で隠れていても、肩・肘・手首・股関節・膝・足首の位置を意識する。

・布、織物、刺繍、革、毛皮、金属、宝石など、素材の違いを描き分ける。

■最終確認
・人物本人の特徴を維持し、元衣装の配色・露出・構造を引き継いでいない。抽選した衣装文化が明確に分かり、着用構造に大きな矛盾がない。条件に矛盾がある場合は、抽選結果を変えず、人体や衣装の自然な成立を優先して調整する。
・単なる資料再現ではなく、人物が実際にその場面で動き、生活しているような、魅力的なキャラクターイラストに仕上げる。`;
const STA="高品質な現代アニメ調の完成イラスト。人物の顔立ちは参照画像に忠実に描く。線画は明瞭にし、過度に細い線を増やさない。髪は大きめの毛束を基本に整理する。肌は柔らかな陰影で立体感を表現する。衣装の布地・刺繍・織物は質感を丁寧に描写する。人物と背景の光源・色温度を統一し、背景は人物に自然に馴染ませる。過剰な粒子・ノイズ・発光演出は避ける。";
const CLOSE="上記を固定条件として画像を生成してください。再抽選はしないでください。";
const gs=D.map(([n,f,l])=>({n,f,a:1,b:1,s:l.split(",").map(x=>{const[a,e]=x.split("|");return{n:a.replace("!",""),e,d:a[0]!="!",on:a[0]!="!"}})}));
const flat=gs.flatMap(g=>g.s),st={h:[],r:null,sheet:""},KEY="cg1",SS={m:"A",c:""};
let OP={v:"m",c:0,n:1};try{Object.assign(OP,JSON.parse(localStorage.getItem("cg1o")))}catch(e){}
const code=()=>"v1:"+flat.map((x,i)=>x.on?"":i.toString(36)).filter(Boolean).join(".");
function apply(c){const m=/^v1:(.*)$/.exec((c||"").trim());if(!m)return false;flat.forEach(x=>x.on=true);m[1].split(".").filter(Boolean).forEach(k=>{const x=flat[parseInt(k,36)];if(x)x.on=false});return true}
function save(){try{localStorage.setItem(KEY,JSON.stringify({o:code(),h:st.h}))}catch(e){}}
try{const j=JSON.parse(localStorage.getItem(KEY));if(j){apply(j.o);st.h=j.h||[]}}catch(e){}
try{Object.assign(SS,JSON.parse(localStorage.getItem(KEY+"s")))}catch(e){}
function R(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}
const msg=t=>$("msg").textContent=t;
const box=$("list");
gs.forEach(g=>{const d=E("details"),s=E("summary"),cb=E("input"),ct=E("span","cnt"),w=E("div","sp");
cb.type="checkbox";cb.onchange=()=>{g.s.forEach(x=>x.on=cb.checked);refresh();save()};
s.append(cb,E("span","",g.n+(g.a==g.b?"":"（"+g.a+"〜"+g.b+"個）")),ct);
g.s.forEach(x=>{const l=E("label"),i=E("input");i.type="checkbox";i.onchange=()=>{x.on=i.checked;refresh();save()};l.append(i,x.n);w.append(l);x.k=i;x.l=l});
d.append(s,w);Object.assign(g,{cb,ct,d});box.append(d)});
function refresh(){gs.forEach(g=>{const n=g.s.filter(x=>x.on).length;g.s.forEach(x=>x.k.checked=x.on);g.cb.checked=n==g.s.length;g.cb.indeterminate=n>0&&n<g.s.length;g.ct.textContent=n+"/"+g.s.length})}
const PO=["左上","右上","左下","右下"],card=()=>OP.c||OP.n>1,act=g=>!g.f||(g.f=="c"?card():g.f==OP.v),gt=g=>g.n.replace(/（.*）/,"");
function pk(g){const p=g.s.filter(x=>x.on),k=Math.min(p.length,1),o=[];for(let i=0;i<k;i++)o.push(p.splice(R(p.length),1)[0].n);return o}
function pg(i,p){const g=gs[i],pv=st.r&&st.r[p]&&st.r[p][i];let v=pk(g);if(pv&&pv[0]==v[0]&&g.s.filter(x=>x.on).length>1)v=pk(g);return v}
const pull=p=>gs.map((g,i)=>act(g)?pg(i,p):null);
function draw(p,i){if(!flat.some(x=>x.on)){msg("有効な項目がありません。選択をオンにしてください");return}
if(p==null){st.r=Array.from({length:OP.n},(_,k)=>pull(k));st.r.forEach(q=>st.h.push(q.map(a=>a&&a.slice())));if(st.h.length>500)st.h=st.h.slice(-500);msg("")}
else if(i==null){st.r[p]=pull(p);msg((p+1)+"回目だけ引き直しました")}
else{st.r[p][i]=pg(i,p);msg(gt(gs[i])+"だけ引き直しました")}
render();save()}
function render(){const r=$("res");r.innerHTML="";const L=["【確定抽選シート"+(OP.n>1?"（4連）":"")+"】","抽選方法：ブラウザの暗号論的乱数（crypto.getRandomValues）を使用","版："+(OP.v=="m"?"男性衣装版":"女性衣装版")];
st.r.forEach((q,p)=>{if(OP.n>1){const h=E("div","ph"),b=E("button","","この回を引き直す");b.onclick=()=>draw(p);h.append(E("span","",(p+1)+"回目（"+PO[p]+"）"),b);r.append(h);L.push("","■"+(p+1)+"回目（"+PO[p]+"）")}
q.forEach((a,i)=>{if(!a)return;const g=gs[i],t=a.join("、")||"なし",w=E("div","rw"),b=E("button","","引き直す"),it=g.s.find(x=>x.n==a[0]);b.onclick=()=>draw(p,i);w.append(E("span","",gt(g)),E("b","",t),b);r.append(w);L.push(gt(g)+"："+t+(card()&&it&&it.e?"（国名・地域名の英語表記："+it.e+"）":""))})});
st.sheet=L.join("\n");pvu();tally()}
function build(){const sty=SS.m=="A"?STA:SS.m=="C"?SS.c.trim():"";return COM+"\n\n"+(OP.v=="m"?MEN:WOM)+"\n\n"+(card()?CARDR:TXT)+(OP.n>1?"\n\n"+QUAD:"")+"\n\n"+BODY+"\n\n【画風】\n"+(sty||"指定なし。画像生成AIの標準的な画風で仕上げる。")+"\n\n"+(st.sheet||"（抽選するとここに確定抽選シートが入ります）")}

function opu(init){document.querySelectorAll("input[name=vr]").forEach(r=>r.checked=r.value==OP.v);document.querySelectorAll("input[name=nr]").forEach(r=>r.checked=r.value==OP.n);$("cdk").checked=!!card();$("cdk").disabled=OP.n>1;

document.querySelectorAll("input[name=vr]").forEach(r=>r.onchange=()=>{OP.v=r.value;opu()});

$("cdk").onchange=()=>{OP.c=$("cdk").checked?1:0;opu()};
function sv(){$("cst").hidden=SS.m!="C";pvu();try{localStorage.setItem(KEY+"s",JSON.stringify(SS))}catch(e){}}
async function cpy(t,ok){if(!t){msg("先に抽選してください");return}try{await navigator.clipboard.writeText(t)}catch(e){const a=E("textarea");a.value=t;document.body.append(a);a.select();document.execCommand("copy");a.remove()}msg(ok)}
const sel=$("tg");gs.forEach((g,i)=>{const o=E("option","",g.n);o.value=i;sel.append(o)});sel.onchange=tally;

$("n").textContent="抽選回数："+st.h.length+"回（全部を引き直した回だけ数えます）";
gs[gi].s.forEach(x=>{const v=m[x.n]||0,r=E("div","bar"),i=E("i");i.style.width=v/mx*100+"%";r.append(E("span","",x.n),i,E("b","",v));t.append(r)})}

$("rs").onclick=()=>{flat.forEach(x=>x.on=x.d);refresh();save()};
$("q").oninput=e=>{const q=e.target.value.trim();gs.forEach(g=>{let any=false;g.s.forEach(x=>{const m=!q||x.n.includes(q)||g.n.includes(q);x.l.hidden=!m;any=any||m});g.d.hidden=!any;g.d.open=!!q&&any})};
$("hc").onclick=()=>{st.h=[];tally();save()};
$("ce").onclick=()=>{$("cd").value=code()};
$("ci").onclick=()=>{if(apply($("cd").value)){refresh();save();msg("設定を読み込みました")}else msg("コードの形式が違います")};
document.querySelectorAll("input[name=sm]").forEach(r=>{r.checked=r.value==SS.m;r.onchange=()=>{SS.m=r.value;sv()}});

const TM=["time","light","dusk","dark","auto"],TL={time:"時間帯",light:"ライト",dusk:"夕方",dark:"ダーク",auto:"端末設定"},t0=document.documentElement.getAttribute("data-theme"),TK="shiodamari-theme";let tm="time";function readTheme(){try{const saved=localStorage.getItem(TK);return TM.includes(saved)?saved:"time"}catch(e){return "time"}}tm=readTheme();
const PH={light:"昼",dusk:"夕方",dark:"夜"};
function ph(){const d=new Date(),h=d.getHours()+d.getMinutes()/60,n=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5),c=Math.cos(2*Math.PI*(n-172)/365),sr=5.6-1.18*c,ss=17.77+1.23*c;return h<sr-.3||h>=ss+.5?"dark":h>=ss-.75?"dusk":"light"}
function tmu(){const r=document.documentElement,p=ph(),v=tm=="auto"?t0:tm=="time"?p:tm;v?r.setAttribute("data-theme",v):r.removeAttribute("data-theme");$("th").value=tm;for(const o of $("th").options)o.textContent=TL[o.value]+(o.value=="time"?"（今は"+PH[p]+"）":"")}setInterval(tmu,60000);

TM.forEach(v=>{const o=document.createElement("option");o.value=v;$("th").append(o)});$("th").onchange=()=>{tm=$("th").value;try{localStorage.setItem(TK,tm)}catch(e){}tmu()};
