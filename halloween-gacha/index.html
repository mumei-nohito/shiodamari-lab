const RULES=`【画像生成ルール】

■キャラクターの固定
・性別、年齢区分、顔立ち・骨格、肌色、瞳の色と基本形状、髪色と基本的な長さ、体格、身体の性別的特徴、種族、固有の耳・角・尻尾・翼・爪など、本人を識別する特徴は固定し、仮装を理由に変更・省略・別キャラクター化しない。
・テーマから性別・種族・体格・顔立ちを再設計しない（例：幽霊船長を男性海賊にしない、魔法使いをエルフにしない）。常に「添付キャラクター本人がその仮装をしている」状態で描く。
・人物は今回添付されたキャラクターだけを参照し、過去に生成した別キャラクターの特徴を混入させない。

■抽選結果の固定
・下の確定抽選シートに従う。再抽選せず、「似合う・定番・生成しやすい・見栄えがよい」を理由に変更しない。ちぐはぐな組み合わせでも捨てず、一枚絵として成立させる。
・仮装テーマや衣装を、キャラクターの性別・外見・性格・種族・雰囲気で選び直さない。
・「オリジナル仮装」「その他」が出た場合のみ、AIが独自に考える。
・雰囲気がテーマと食い違っても変えず、そのギャップを活かす。

■衣装・身体
・本人固有の耳・角・尻尾などを消したり、別種族の特徴へ置き換えたりしない。抽選された身体的な仮装要素と競合する場合は、装飾や衣装パーツとして自然に共存させる。
・髪色は仮装を理由に変えない。髪型は抽選結果に従う。
・露出度は、性別・体格・テーマ・元衣装と連動させない。「大胆」でもファッションとして成立する範囲とし、下着や水着相当以上の過度な露出、裸体に近いデザインにはしない。
・小物は抽選された分だけ描き、テーマから連想される小物（魔女なら箒など）を自動で足さない。

・姿勢、身体方向、顔の向き、手の位置、脚の配置、カメラ、画角を、可能な限り独立して扱う。
・「座る・しゃがむ・寝転ぶ＋片脚を手前へ大きく出す＋煽り」「頬杖」「片手を顔に添える」「口元へ指や小物を近づける」「身体を斜めに倒してこちらを見る」など、生成AIが好む定番構図へ収束させない。単純な左右反転で済ませない。
・参照画像の表情や顔の角度を既定にしない。

■人体・描画品質
・元の体格・肩幅・胸郭・胴の長さ・腰幅・四肢の比率を維持する。衣装の厚みや装飾で人体の骨格を拡大・変形させない。外側のシルエットが大きくなっても、内側には元の人物と同じ自然な人体構造があるものとして描く。
・首から肩、肩から腕、胸郭から腰、骨盤から脚までを自然につなげる。関節が衣装で隠れていても、肩・肘・手首・股関節・膝・足首の位置を意識する。
・手は手首から指先まで解剖学的につなげ、掌・手の甲・親指の位置関係を正しく描く。左右が反転した手、余分な指、欠けた指、融合した指を避ける。
・布、織物、刺繍、革、毛皮、金属、宝石など、素材の違いを描き分ける。

const PH={light:"昼",dusk:"夕方",dark:"夜"};
function ph(){const d=new Date(),h=d.getHours()+d.getMinutes()/60,n=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5),c=Math.cos(2*Math.PI*(n-172)/365),sr=5.6-1.18*c,ss=17.77+1.23*c;return h<sr-.3||h>=ss+.5?"dark":h>=ss-.75?"dusk":"light"}
function tmu(){const r=document.documentElement,p=ph(),v=tm=="auto"?t0:tm=="time"?p:tm;v?r.setAttribute("data-theme",v):r.removeAttribute("data-theme");$("th").value=tm;for(const o of $("th").options)o.textContent=TL[o.value]+(o.value=="time"?"（今は"+PH[p]+"）":"")}setInterval(tmu,60000);
function syncTheme(){const next=readTheme();if(next!==tm){tm=next;tmu()}}
window.addEventListener("storage",e=>{if(e.key===TK||e.key===null)syncTheme()});
window.addEventListener("focus",syncTheme);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncTheme()});
TM.forEach(v=>{const o=document.createElement("option");o.value=v;$("th").append(o)});$("th").onchange=()=>{tm=$("th").value;try{localStorage.setItem(TK,tm)}catch(e){}tmu()};
tmu();refresh();tally();sv();
</script></body></html>
